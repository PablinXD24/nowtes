<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LiquidGlass Pro | Final Master</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Lora:ital,wght@0,400;1,400&family=JetBrains+Mono:wght@300;400&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --toolbar-bg: rgba(15, 15, 15, 0.95);
            --accent: #40bcf4;
            --page-bg: #ffffff;
            --text-color: #1a1a1a;
            --letterboxd-green: #00e054;
        }

        body.dark-mode-page { 
            --page-bg: #181818; 
            --text-color: #f5f5f5; 
        }

        * { box-sizing: border-box; transition: background 0.3s, color 0.3s, transform 0.2s; }
        
        body { 
            margin: 0; font-family: 'Inter', sans-serif; 
            background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%); 
            height: 100vh; display: flex; flex-direction: column; overflow: hidden; color: #fff;
        }

        /* SIDEBAR */
        aside { 
            position: fixed; left: 25px; top: 50%; transform: translateY(-50%);
            display: flex; flex-direction: column; align-items: center; z-index: 1100;
        }
        .sidebar-inner { 
            background: var(--toolbar-bg); backdrop-filter: blur(25px); 
            border: 1px solid rgba(255,255,255,0.1); padding: 12px; 
            border-radius: 50px; display: flex; flex-direction: column; gap: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        /* TOOLBAR */
        header { padding: 15px; display: flex; justify-content: center; position: fixed; width: 100%; top: 0; z-index: 1000; }
        .toolbar { 
            background: var(--toolbar-bg); backdrop-filter: blur(25px); border: 1px solid rgba(255,255,255,0.1); 
            padding: 8px 20px; border-radius: 60px; display: flex; gap: 10px; align-items: center; 
            box-shadow: 0 15px 50px rgba(0,0,0,0.6); max-width: 95%; overflow-x: auto; scrollbar-width: none;
        }
        .toolbar::-webkit-scrollbar { display: none; }
        
        .group { display: flex; gap: 5px; border-right: 1px solid rgba(255,255,255,0.1); padding-right: 10px; align-items: center; flex-shrink: 0; }
        .group:last-child { border: none; }

        button, select, .file-btn { 
            background: rgba(255,255,255,0.05); border: none; color: #fff; cursor: pointer; 
            height: 32px; border-radius: 16px; display: flex; align-items: center; 
            justify-content: center; transition: 0.2s; font-size: 12px; padding: 0 10px; flex-shrink: 0;
        }
        button:hover { background: rgba(255,255,255,0.15); color: var(--accent); }
        .btn-active { background: var(--accent) !important; color: #000; }
        .circle-btn { width: 32px; border-radius: 50%; padding: 0; flex-shrink: 0; }

        input[type="color"] { border: none; width: 22px; height: 22px; cursor: pointer; background: none; padding: 0; margin: 0 5px; }

        /* EDITOR */
        .workspace { flex: 1; display: flex; flex-direction: column; width: 100%; }
        main { flex: 1; overflow-y: auto; padding: 120px 20px; display: flex; flex-direction: column; align-items: center; scrollbar-width: none; }

        .editor-page {
            background: var(--page-bg); color: var(--text-color);
            box-shadow: 0 40px 100px rgba(0,0,0,0.8); outline: none;
            transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1);
            max-width: 100%; position: relative;
        }

        .mode-a4 { width: 210mm; min-height: 297mm; padding: 25mm; border-radius: 4px; font-size: 12pt; }
        .mode-letterboxd { width: 380px; min-height: auto; padding: 40px; border-radius: 35px; text-align: center; }

        .widget-ui { display: none; margin-bottom: 25px; border-bottom: 1px solid rgba(128,128,128,0.2); padding-bottom: 20px; }
        .mode-letterboxd .widget-ui { display: block; }
        .rating-stars { color: var(--letterboxd-green); font-size: 26px; margin: 10px 0; }

        footer { background: transparent; color: #555; padding: 15px 20px; font-size: 10px; display: flex; justify-content: space-between; font-family: 'JetBrains Mono'; }

        /* MODAL */
        #share-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 2000; align-items: center; justify-content: center;
        }
        .modal-content {
            background: #222; padding: 30px; border-radius: 25px; text-align: center;
            border: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; gap: 15px;
        }

        @media (max-width: 768px) {
            aside { position: fixed; bottom: 80px; left: 50%; top: auto; transform: translateX(-50%); flex-direction: row; }
            .sidebar-inner { flex-direction: row; }
            #file-list { flex-direction: row !important; }
            .mode-a4 { width: 95vw; padding: 20px; }
            .mode-letterboxd { width: 90vw; }
        }
    </style>
</head>
<body class="dark-mode-page">

    <audio id="bg-music" loop>
        <source src="https://www.soundboard.com/handler/DownLoadTrack.ashx?cliptitle=Hedwigs+Theme&filename=22/227448-f6e08872-3f19-4828-9d2a-e837136015a1.mp3" type="audio/mpeg">
    </audio>

    <aside>
        <div class="sidebar-inner">
            <button onclick="newFile()" class="circle-btn btn-active"><i class="fa fa-plus"></i></button>
            <div id="file-list" style="display:flex; flex-direction:column; gap:12px;"></div>
        </div>
    </aside>

    <div id="share-modal" onclick="this.style.display='none'">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3 style="margin:0 0 10px 0;">Compartilhar Magia</h3>
            <button onclick="exportPro('download')" style="background: var(--accent); color: #000; font-weight: bold; height: 45px; border-radius: 12px;">
                <i class="fa fa-download"></i> Baixar Imagem (PNG)
            </button>
            <button onclick="shareNative()" style="background: rgba(255,255,255,0.1); height: 45px; border-radius: 12px; color: white;">
                <i class="fa fa-share-nodes"></i> Enviar para Redes
            </button>
        </div>
    </div>

    <div class="workspace">
        <header>
            <div class="toolbar">
                <div class="group">
                    <select id="mode-selector" onchange="updateProjectMode(this.value)" style="color: var(--accent); font-weight: 800; background: #222;">
                        <option value="mode-a4">A4</option>
                        <option value="mode-letterboxd">STORY</option>
                    </select>
                    <select onchange="exec('fontName', this.value)" style="width: 80px;">
                        <option value="Inter">Inter</option>
                        <option value="Lora">Lora</option>
                        <option value="Playfair Display">Playfair</option>
                        <option value="JetBrains Mono">Mono</option>
                    </select>
                    <select onchange="exec('fontSize', this.value)" style="width: 50px;">
                        <option value="3">Med</option>
                        <option value="1">Peq</option>
                        <option value="5">Grd</option>
                        <option value="7">U-Grd</option>
                    </select>
                </div>

                <div class="group">
                    <button class="circle-btn" onclick="exec('bold')" title="Negrito"><i class="fa fa-bold"></i></button>
                    <button class="circle-btn" onclick="exec('italic')" title="Itálico"><i class="fa fa-italic"></i></button>
                    <button class="circle-btn" onclick="exec('underline')" title="Sublinhado"><i class="fa fa-underline"></i></button>
                    <button class="circle-btn" onclick="exec('strikeThrough')" title="Riscado"><i class="fa fa-strikethrough"></i></button>
                    <input type="color" onchange="exec('foreColor', this.value)" title="Cor da Fonte">
                </div>

                <div class="group">
                    <button class="circle-btn" onclick="exec('justifyLeft')"><i class="fa fa-align-left"></i></button>
                    <button class="circle-btn" onclick="exec('justifyCenter')"><i class="fa fa-align-center"></i></button>
                    <button class="circle-btn" onclick="exec('justifyRight')"><i class="fa fa-align-right"></i></button>
                </div>

                <div class="group">
                    <button class="circle-btn" onclick="exec('insertUnorderedList')"><i class="fa fa-list-ul"></i></button>
                    <button class="circle-btn" onclick="exec('insertOrderedList')"><i class="fa fa-list-ol"></i></button>
                    <button class="circle-btn" onclick="exec('indent')"><i class="fa fa-indent"></i></button>
                    <button class="circle-btn" onclick="exec('outdent')"><i class="fa fa-outdent"></i></button>
                </div>

                <div class="group">
                    <button class="circle-btn" onclick="insertImagePrompt()"><i class="fa fa-image"></i></button>
                    <button class="circle-btn" onclick="exec('removeFormat')" title="Limpar Estilos"><i class="fa fa-eraser"></i></button>
                </div>

                <div class="group">
                    <button class="circle-btn" onclick="toggleDarkMode()"><i class="fa fa-circle-half-stroke"></i></button>
                    <button class="circle-btn" onclick="toggleMusic()"><i class="fa fa-wand-sparkles"></i></button>
                    <button onclick="document.getElementById('share-modal').style.display='flex'" style="color: var(--letterboxd-green); font-weight: bold;"><i class="fa fa-paper-plane"></i></button>
                    <button class="circle-btn" onclick="saveCurrent()"><i class="fa fa-save"></i></button>
                </div>
            </div>
        </header>

        <main>
            <div id="editor" class="editor-page mode-a4" contenteditable="true">
                <div class="widget-ui" contenteditable="false">
                    <div class="author-name">Análise por @seuusuario</div>
                    <h1 style="margin: 10px 0; font-size: 28px;">Título</h1>
                    <div class="rating-stars">★★★★★</div>
                </div>
                <div class="main-content">Escreva sua obra prima aqui...</div>
            </div>
        </main>

        <footer>
            <div id="save-status">Pronto para a magia.</div>
            <div id="stats">LiquidGlass Elite</div>
        </footer>
    </div>

    <script>
        let currentFileId = 'default';
        let files = JSON.parse(localStorage.getItem('lg_master_v9')) || { 
            'default': { name: 'Projeto 1', content: 'Escreva sua obra prima aqui...', mode: 'mode-a4' }
        };

        function exec(cmd, val = null) { document.execCommand(cmd, false, val); document.getElementById('editor').focus(); }
        function toggleDarkMode() { document.body.classList.toggle('dark-mode-page'); }
        function toggleMusic() { const m = document.getElementById('bg-music'); m.paused ? m.play() : m.pause(); }

        function insertImagePrompt() {
            const url = prompt("Cole a URL da imagem:");
            if(url) exec('insertImage', url);
        }

        function updateProjectMode(mode) { 
            const editor = document.getElementById('editor');
            editor.className = 'editor-page ' + mode;
            saveCurrent();
        }

        function saveCurrent() {
            if(!files[currentFileId]) return;
            files[currentFileId].content = document.getElementById('editor').innerHTML;
            files[currentFileId].mode = document.getElementById('mode-selector').value;
            localStorage.setItem('lg_master_v9', JSON.stringify(files));
            document.getElementById('save-status').innerText = "Salvo: " + new Date().toLocaleTimeString();
        }

        function renderFileList() {
            const list = document.getElementById('file-list');
            list.innerHTML = '';
            Object.keys(files).forEach(id => {
                const btn = document.createElement('div');
                btn.className = `file-btn circle-btn ${id === currentFileId ? 'btn-active' : ''}`;
                btn.innerHTML = `<i class="fa ${files[id].mode === 'mode-a4' ? 'fa-file-alt' : 'fa-film'}"></i>`;
                btn.onclick = () => loadFile(id);
                list.appendChild(btn);
            });
        }

        function loadFile(id) {
            currentFileId = id;
            const file = files[id];
            document.getElementById('editor').innerHTML = file.content;
            document.getElementById('mode-selector').value = file.mode;
            document.getElementById('editor').className = 'editor-page ' + file.mode;
            renderFileList();
        }

        function newFile() {
            const name = prompt("Nome do projeto:");
            if(name) {
                const id = 'f' + Date.now();
                files[id] = { name: name, content: 'Nova escrita...', mode: 'mode-a4' };
                loadFile(id);
            }
        }

        async function exportPro(action = 'download') {
            const editor = document.getElementById('editor');
            const originalShadow = editor.style.boxShadow;
            editor.style.boxShadow = 'none';

            const canvas = await html2canvas(editor, { 
                scale: 3, 
                backgroundColor: null,
                useCORS: true 
            });

            editor.style.boxShadow = originalShadow;
            const imgData = canvas.toDataURL("image/png");

            if(action === 'download') {
                const link = document.createElement('a');
                link.download = `Liquid-${files[currentFileId].name}.png`;
                link.href = imgData;
                link.click();
            }
            return imgData;
        }

        async function shareNative() {
            const imgData = await exportPro('return');
            const blob = await (await fetch(imgData)).blob();
            const file = new File([blob], 'obra-prima.png', { type: 'image/png' });
            if (navigator.share) {
                navigator.share({ files: [file], title: 'LiquidGlass Pro' }).catch(console.error);
            } else {
                alert("Navegador não suporta compartilhamento direto.");
            }
        }

        window.onload = () => { renderFileList(); loadFile(currentFileId); };
        setInterval(saveCurrent, 10000);
    </script>
</body>
</html>
