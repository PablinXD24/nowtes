<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiquidGlass Pro | Elite Edition</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Lora:ital,wght@0,400;0,700;1,400;1,700&family=JetBrains+Mono:wght@300;400&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --page-width: 210mm;
            --page-height: 297mm;
            --glass-sheet: rgba(255, 255, 255, 0.92);
            --toolbar-bg: rgba(20, 20, 20, 0.8);
            --accent: #40bcf4;
            --radius: 25px;
        }

        body.dark-mode-page {
            --glass-sheet: rgba(30, 33, 37, 0.96);
            --text-main: #efefef;
        }

        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Inter', sans-serif; background: #000; height: 100vh; display: flex; overflow: hidden; }

        /* SIDEBAR VERTICAL (ESTILO TOOLBAR) */
        aside {
            display: flex; flex-direction: column; align-items: center; padding: 20px;
            gap: 15px; position: relative; z-index: 100;
        }

        .sidebar-inner {
            background: var(--toolbar-bg); backdrop-filter: blur(25px);
            border: 1px solid rgba(255,255,255,0.1); padding: 15px 10px;
            border-radius: 40px; display: flex; flex-direction: column; gap: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5); max-height: 80vh; overflow-y: auto;
        }

        .sidebar-inner::-webkit-scrollbar { display: none; }

        /* TOOLBAR TOPO */
        header {
            padding: 20px; display: flex; justify-content: center;
            position: fixed; width: calc(100% - 100px); left: 100px; top: 0; z-index: 1000;
        }

        .toolbar {
            background: var(--toolbar-bg); backdrop-filter: blur(25px);
            border: 1px solid rgba(255,255,255,0.1); padding: 8px 18px;
            border-radius: 50px; display: flex; gap: 12px; align-items: center;
            box-shadow: 0 15px 50px rgba(0,0,0,0.8);
        }

        .group { display: flex; gap: 6px; align-items: center; border-right: 1px solid rgba(255,255,255,0.1); padding-right: 12px; }
        .group:last-child { border: none; }

        /* BOTÕES E INPUTS */
        button, select, .file-btn {
            background: rgba(255,255,255,0.05); border: none; color: #fff; cursor: pointer;
            width: 42px; height: 42px; border-radius: 50%; display: flex; 
            align-items: center; justify-content: center; transition: 0.3s; font-size: 14px;
        }
        
        button:hover, .file-btn:hover { background: rgba(255,255,255,0.15); transform: scale(1.1); }
        .active-file { background: var(--accent) !important; color: #000; }
        
        select { width: auto; border-radius: 20px; padding: 0 10px; font-size: 12px; }
        input[type="color"] { border: none; width: 30px; height: 30px; cursor: pointer; background: none; }

        /* ÁREA DE EDIÇÃO */
        .workspace { flex: 1; display: flex; flex-direction: column; position: relative; }

        main {
            flex: 1; overflow-y: auto; padding: 120px 0 80px;
            display: flex; flex-direction: column; align-items: center; gap: 35px;
            background: radial-gradient(circle at center, #151515 0%, #000 100%);
        }

        .page {
            background: var(--glass-sheet); width: var(--page-width);
            min-height: var(--page-height); height: var(--page-height);
            padding: 28mm; border-radius: var(--radius);
            box-shadow: 0 40px 100px rgba(0,0,0,0.6);
            outline: none; font-size: 12pt; line-height: 1.6; color: var(--text-main, #1d1d1f);
            overflow: hidden; position: relative;
        }

        footer {
            background: #000; color: #444; padding: 12px 30px;
            display: flex; justify-content: space-between; font-size: 10px;
            border-top: 1px solid #111; font-family: 'JetBrains Mono';
        }
    </style>
</head>
<body>

    <audio id="bg-music" loop>
        <source src="https://www.soundboard.com/handler/DownLoadTrack.ashx?cliptitle=Hedwigs+Theme&filename=22/227448-f6e08872-3f19-4828-9d2a-e837136015a1.mp3" type="audio/mpeg">
    </audio>

    <aside>
        <div class="sidebar-inner">
            <button onclick="newFile()" title="Novo Filme" style="background:var(--accent); color:#000"><i class="fa fa-plus"></i></button>
            <div id="file-list" style="display:flex; flex-direction:column; gap:10px;">
                </div>
        </div>
    </aside>

    <div class="workspace">
        <header>
            <div class="toolbar">
                <div class="group">
                    <button onclick="toggleMusic()"><i class="fa fa-wand-sparkles"></i></button>
                    <button onclick="toggleDarkMode()"><i class="fa fa-moon"></i></button>
                </div>

                <div class="group">
                    <select onchange="exec('fontName', this.value)">
                        <option value="Inter">Inter</option>
                        <option value="Lora">Lora</option>
                        <option value="Playfair Display">Playfair</option>
                        <option value="JetBrains Mono">Mono</option>
                    </select>
                    <button onclick="exec('bold')"><i class="fa fa-bold"></i></button>
                    <button onclick="exec('italic')"><i class="fa fa-italic"></i></button>
                    <input type="color" onchange="exec('foreColor', this.value)" title="Cor do Texto">
                </div>

                <div class="group">
                    <button onclick="exec('justifyLeft')"><i class="fa fa-align-left"></i></button>
                    <button onclick="exec('justifyCenter')"><i class="fa fa-align-center"></i></button>
                    <button onclick="exec('justifyFull')"><i class="fa fa-align-justify"></i></button>
                </div>

                <div class="group">
                    <button onclick="exportStory()" style="color:#00e054;"><i class="fa fa-paper-plane"></i></button>
                    <button onclick="saveCurrent()"><i class="fa fa-save"></i></button>
                </div>
            </div>
        </header>

        <main id="editor-container" ondrop="dropImage(event)" ondragover="event.preventDefault()">
            </main>

        <footer>
            <div id="stats">Palavras: 0 | 0 min</div>
            <div id="save-status">Sistema Ativo</div>
            <div id="pg-count">Páginas: 1</div>
        </footer>
    </div>

    <script>
        let currentFileId = 'default';
        let files = JSON.parse(localStorage.getItem('lg_elite_v4')) || { 
            'default': { name: 'Crítica 1', content: '<div class="page" contenteditable="true"><h1>Título do Filme</h1><p>Comece a escrever...</p></div>' }
        };

        function exec(cmd, val = null) { document.execCommand(cmd, false, val); }

        function renderFileList() {
            const list = document.getElementById('file-list');
            list.innerHTML = '';
            Object.keys(files).forEach(id => {
                const btn = document.createElement('div');
                btn.className = `file-btn ${id === currentFileId ? 'active-file' : ''}`;
                btn.innerHTML = `<i class="fa fa-film"></i>`;
                btn.title = files[id].name;
                btn.onclick = () => loadFile(id);
                list.appendChild(btn);
            });
        }

        function newFile() {
            const name = prompt("Nome da obra:");
            if(name) {
                const id = 'f' + Date.now();
                files[id] = { name: name, content: `<div class="page" contenteditable="true"><h1>${name}</h1><p>Inicie sua análise...</p></div>` };
                saveAll();
                loadFile(id);
            }
        }

        function loadFile(id) {
            currentFileId = id;
            document.getElementById('editor-container').innerHTML = files[id].content;
            renderFileList();
            updateStats();
        }

        function saveCurrent() {
            files[currentFileId].content = document.getElementById('editor-container').innerHTML;
            saveAll();
            document.getElementById('save-status').innerText = "Salvo: " + new Date().toLocaleTimeString();
        }

        function saveAll() { localStorage.setItem('lg_elite_v4', JSON.stringify(files)); }

        document.getElementById('editor-container').addEventListener('input', () => {
            const container = document.getElementById('editor-container');
            const lastPage = container.lastElementChild;
            if (lastPage.scrollHeight > lastPage.offsetHeight) {
                const p = document.createElement('div');
                p.className = 'page'; p.contentEditable = true;
                container.appendChild(p);
                p.focus();
            }
            updateStats();
        });

        function dropImage(e) {
            e.preventDefault();
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const img = `<img src="${ev.target.result}" style="max-width:100%; border-radius:20px; margin: 20px 0; box-shadow: 0 20px 40px rgba(0,0,0,0.3)">`;
                    document.execCommand('insertHTML', false, img);
                };
                reader.readAsDataURL(file);
            }
        }

        function updateStats() {
            const text = document.getElementById('editor-container').innerText;
            const words = text.trim() ? text.trim().split(/\s+/).length : 0;
            document.getElementById('stats').innerText = `${words} palavras | ${Math.ceil(words/200)} min`;
            document.getElementById('pg-count').innerText = `Pgs: ${document.querySelectorAll('.page').length}`;
        }

        function toggleMusic() { const m = document.getElementById('bg-music'); m.paused ? m.play() : m.pause(); }
        function toggleDarkMode() { document.body.classList.toggle('dark-mode-page'); }

        async function exportStory() {
            const canvas = await html2canvas(document.getElementById('editor-container').firstElementChild, { scale: 3, borderRadius: 25 });
            const link = document.createElement('a');
            link.download = 'liquid-story.png';
            link.href = canvas.toDataURL();
            link.click();
        }

        setInterval(saveCurrent, 10000);
        window.onload = () => { renderFileList(); loadFile(currentFileId); };
    </script>
</body>
</html>
