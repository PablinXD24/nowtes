<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LiquidGlass Pro | Studio Edition</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@300;400&family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --page-width: 210mm;
            --page-height: 297mm;
            --glass-sheet: rgba(255, 255, 255, 0.88);
            --glass-stroke: rgba(255, 255, 255, 0.4);
            --accent: #0071e3;
            --border-radius: 25px;
        }

        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }

        body {
            margin: 0; font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at center, #2c2c2e 0%, #1c1c1e 100%);
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
            color: #333;
        }

        /* Cortina de Cetim Preta Reta */
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(90deg, #000 0%, #0a0a0a 10%, #000 20%, #0a0a0a 30%, #000 40%, #0a0a0a 50%, #000 60%, #0a0a0a 70%, #000 80%, #0a0a0a 90%, #000 100%);
            opacity: 0.4; pointer-events: none; z-index: -1;
        }

        header {
            padding: 10px; display: flex; justify-content: center;
            position: fixed; width: 100%; top: 0; z-index: 1000;
        }

        .toolbar {
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 8px 15px; border-radius: 50px;
            display: flex; align-items: center; gap: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 95%; overflow-x: auto;
        }

        .group { display: flex; align-items: center; gap: 5px; border-right: 1px solid rgba(255,255,255,0.1); padding-right: 8px; }
        .group:last-child { border-right: none; }

        button, select {
            background: transparent; border: none; padding: 10px; cursor: pointer;
            border-radius: 12px; color: #eee; transition: 0.2s; font-size: 14px;
        }

        button:active { background: rgba(255,255,255,0.2); }
        select { background: rgba(255,255,255,0.05); color: #fff; max-width: 80px; outline: none; }

        main {
            flex: 1; overflow-y: auto; padding: 80px 15px 100px;
            display: flex; flex-direction: column; align-items: center; gap: 25px;
            scroll-behavior: smooth;
        }

        .page {
            background: var(--glass-sheet);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            width: var(--page-width);
            height: var(--page-height);
            min-height: var(--page-height);
            padding: 25mm;
            border: 1px solid var(--glass-stroke);
            border-radius: var(--border-radius);
            box-shadow: 0 15px 50px rgba(0,0,0,0.3);
            outline: none; line-height: 1.6; font-size: 12pt;
            color: #1d1d1f;
            position: relative; overflow: hidden; word-wrap: break-word;
        }

        /* Estilo da Mini Folha para o Story (Oculta na interface) */
        #story-render-box {
            position: absolute; left: -9999px;
            width: 1080px; height: 1920px; /* Proporção Story Instagram */
            display: flex; align-items: center; justify-content: center;
            background: transparent;
        }

        .mini-glass-page {
            width: 800px; padding: 60px;
            background: rgba(255, 255, 255, 0.15); /* Estilo LiquidGlass apenas nos stories */
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50px;
            color: white; font-size: 42px; text-align: center;
            box-shadow: 0 40px 100px rgba(0,0,0,0.5);
        }

        @media screen and (max-width: 215mm) {
            .page { width: 95vw; height: auto; min-height: 80vh; padding: 15mm 10mm; font-size: 11pt; }
        }

        .f-space { font-family: 'Space Mono', monospace; }
        .f-inter { font-family: 'Inter', sans-serif; }
        .f-code { font-family: 'JetBrains Mono', monospace; }
        .f-serif { font-family: 'Lora', serif; }

        footer {
            padding: 10px 20px; font-size: 10px; color: #888;
            background: rgba(10, 10, 10, 0.98); border-top: 1px solid rgba(255,255,255,0.1);
            display: flex; justify-content: space-between; align-items: center;
            z-index: 1001;
        }
    </style>
</head>
<body class="f-inter">

    <div id="story-render-box">
        <div class="mini-glass-page" id="mini-page"></div>
    </div>

    <header>
        <div class="toolbar">
            <div class="group">
                <select id="fontFamily" onchange="applyFont(this.value)">
                    <option value="f-inter">Inter</option>
                    <option value="f-space">Space</option>
                    <option value="f-code">Code</option>
                    <option value="f-serif">Serif</option>
                </select>
            </div>

            <div class="group">
                <button onclick="exec('bold')"><i class="fa fa-bold"></i></button>
                <button onclick="addNewPage()"><i class="fa fa-plus-circle"></i></button>
            </div>

            <div class="group">
                <button onclick="generateStory()" style="color: #ff007f;"><i class="fa-brands fa-instagram"></i> Story</button>
                <button onclick="exportToPDF()" style="color: #ff453a;"><i class="fa fa-file-pdf"></i></button>
                <button onclick="saveDoc()" style="color: var(--accent);"><i class="fa fa-save"></i></button>
            </div>
        </div>
    </header>

    <main id="document-container">
        <div class="page" contenteditable="true" id="p1">
            <h1>LiquidGlass Pro</h1>
            <p>Escreva seu roteiro aqui. No PDF ele sai A4, no Story ele vira uma Mini-Page flutuante.</p>
        </div>
    </main>

    <footer>
        <div id="stats">Pgs: 1</div>
        <div>CINZA STUDIO | RESPONSIVO</div>
        <div id="status">Ok</div>
    </footer>

    <script>
        const container = document.getElementById('document-container');

        function exec(cmd) { document.execCommand(cmd, false, null); }

        function applyFont(fontClass) {
            document.body.className = fontClass;
            document.getElementById('mini-page').className = "mini-glass-page " + fontClass;
            localStorage.setItem('liquid_pref_font', fontClass);
        }

        function addNewPage() {
            const newPage = document.createElement('div');
            newPage.className = 'page';
            newPage.contentEditable = true;
            container.appendChild(newPage);
            newPage.focus();
            updateStats();
        }

        // FUNÇÃO DE STORY: CRIA MINI FOLHA LIQUIDGLASS
        async function generateStory() {
            const status = document.getElementById('status');
            status.innerText = "Renderizando...";
            
            const miniPage = document.getElementById('mini-page');
            const activeContent = window.getSelection().anchorNode ? 
                                 (window.getSelection().anchorNode.parentElement.closest('.page') || container.firstElementChild) : 
                                 container.firstElementChild;
            
            // Copia o texto para a mini folha
            miniPage.innerHTML = activeContent.innerHTML;
            
            const renderBox = document.getElementById('story-render-box');
            
            try {
                const canvas = await html2canvas(renderBox, {
                    backgroundColor: null,
                    scale: 1,
                    logging: false,
                    useCORS: true
                });

                canvas.toBlob(async (blob) => {
                    const file = new File([blob], 'liquid-story.png', { type: 'image/png' });
                    if (navigator.share) {
                        await navigator.share({ files: [file], title: 'My Story' });
                    } else {
                        const link = document.createElement('a');
                        link.download = 'liquid-story.png';
                        link.href = canvas.toDataURL();
                        link.click();
                    }
                    status.innerText = "Pronto!";
                });
            } catch (err) {
                status.innerText = "Erro";
            }
            setTimeout(() => status.innerText = "Ok", 2000);
        }

        // Navegação Backspace e Transbordamento
        container.addEventListener('keydown', (e) => {
            if (e.key === 'Backspace' && e.target.innerText.trim().length === 0) {
                const prev = e.target.previousElementSibling;
                if (prev && prev.classList.contains('page')) {
                    e.preventDefault();
                    e.target.remove();
                    prev.focus();
                    const range = document.createRange();
                    const sel = window.getSelection();
                    range.selectNodeContents(prev);
                    range.collapse(false);
                    sel.removeAllRanges();
                    sel.addRange(range);
                    updateStats();
                }
            }
        });

        container.addEventListener('input', (e) => {
            if (window.innerWidth > 800 && e.target.scrollHeight > e.target.offsetHeight) {
                if (e.target === container.lastElementChild) addNewPage();
            }
            updateStats();
        });

        function updateStats() {
            document.getElementById('stats').innerText = `Pgs: ${container.querySelectorAll('.page').length}`;
        }

        function exportToPDF() {
            const opt = { margin: 0, filename: 'roteiro.pdf', html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: 'a4' } };
            html2pdf().set(opt).from(container).save();
        }

        function saveDoc() {
            localStorage.setItem('liquid_glass_vFinal', container.innerHTML);
            document.getElementById('status').innerText = "Salvo!";
            setTimeout(() => document.getElementById('status').innerText = "Ok", 2000);
        }

        window.onload = () => {
            const saved = localStorage.getItem('liquid_glass_vFinal');
            const savedFont = localStorage.getItem('liquid_pref_font');
            if (saved) container.innerHTML = saved;
            if (savedFont) {
                applyFont(savedFont);
                document.getElementById('fontFamily').value = savedFont;
            }
        };
    </script>
</body>
</html>
