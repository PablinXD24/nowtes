<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LiquidGlass Pro | Letterboxd Edition</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@300;400&family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --page-width: 210mm;
            --page-height: 297mm;
            --glass-sheet: rgba(255, 255, 255, 0.88);
            --glass-stroke: rgba(255, 255, 255, 0.4);
            --accent: #0071e3;
            --border-radius: 25px;
            --letterboxd-orange: #ff8000;
            --letterboxd-green: #00e054;
            --letterboxd-blue: #40bcf4;
        }

        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }

        body {
            margin: 0; font-family: 'Inter', sans-serif;
            background: #000; /* Fundo base preto sólido */
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
            color: #333;
        }

        /* Cortina de Cetim Preta Reta (Personalização Mantida) */
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(90deg, 
                #000 0%, #0a0a0a 10%, #000 20%, #0a0a0a 30%, 
                #000 40%, #0a0a0a 50%, #000 60%, #0a0a0a 70%, 
                #000 80%, #0a0a0a 90%, #000 100%);
            opacity: 0.8; pointer-events: none; z-index: -1;
        }

        header {
            padding: 10px; display: flex; justify-content: center;
            position: fixed; width: 100%; top: 0; z-index: 1000;
        }

        .toolbar {
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 8px 15px; border-radius: 50px;
            display: flex; align-items: center; gap: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .group { display: flex; align-items: center; gap: 5px; border-right: 1px solid rgba(255,255,255,0.1); padding-right: 8px; }
        .group:last-child { border-right: none; }

        button, select {
            background: transparent; border: none; padding: 10px; cursor: pointer;
            border-radius: 12px; color: #eee; transition: 0.2s; font-size: 14px;
        }

        button:active { background: rgba(255,255,255,0.2); }
        select { background: rgba(255,255,255,0.05); color: #fff; outline: none; }

        main {
            flex: 1; overflow-y: auto; padding: 80px 15px 100px;
            display: flex; flex-direction: column; align-items: center; gap: 25px;
        }

        .page {
            background: var(--glass-sheet);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            width: var(--page-width);
            height: var(--page-height);
            min-height: var(--page-height);
            padding: 25mm;
            border: 1px solid var(--glass-stroke);
            border-radius: var(--border-radius);
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            outline: none; line-height: 1.6; font-size: 12pt;
            color: #1d1d1f; position: relative;
        }

        /* WIDGET LETTERBOXD (Exportação) */
        #story-render-box {
            position: absolute; left: -9999px;
            width: 500px;
            background: transparent;
            padding: 40px;
        }

        .letterboxd-widget {
            background: rgba(20, 24, 28, 0.98);
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
        }

        .widget-content {
            padding: 35px;
            color: #9ab;
            font-size: 22px;
            line-height: 1.5;
            min-height: 150px;
        }

        .widget-content h1 { color: #fff; margin-bottom: 15px; font-weight: 800; }

        .widget-footer {
            background: #2c3440;
            padding: 15px 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-info { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 32px; height: 32px; background: linear-gradient(45deg, var(--accent), #5AC8FA); border-radius: 50%; }
        .username { color: #fff; font-weight: 600; font-size: 17px; }
        
        .letterboxd-logo { display: flex; }
        .dot { width: 14px; height: 14px; border-radius: 50%; margin-left: -5px; border: 1px solid rgba(0,0,0,0.2); }
        .d1 { background: var(--letterboxd-orange); margin-left: 0; }
        .d2 { background: var(--letterboxd-green); }
        .d3 { background: var(--letterboxd-blue); }

        footer {
            padding: 10px 20px; font-size: 10px; color: #666;
            background: rgba(5, 5, 5, 0.98); border-top: 1px solid rgba(255,255,255,0.05);
            display: flex; justify-content: space-between; align-items: center;
            z-index: 1001;
        }
    </style>
</head>
<body class="f-inter">

    <div id="story-render-box">
        <div class="letterboxd-widget" id="widget-card">
            <div class="widget-content" id="widget-text"></div>
            <div class="widget-footer">
                <div class="user-info">
                    <div class="avatar"></div>
                    <span class="username" id="widget-user">@user</span>
                </div>
                <div class="letterboxd-logo">
                    <div class="dot d1"></div>
                    <div class="dot d2"></div>
                    <div class="dot d3"></div>
                </div>
            </div>
        </div>
    </div>

    <header>
        <div class="toolbar">
            <div class="group">
                <select id="fontFamily" onchange="applyFont(this.value)">
                    <option value="f-inter">Inter</option>
                    <option value="f-space">Space</option>
                    <option value="f-code">Code</option>
                    <option value="f-serif">Serif</option>
                </select>
            </div>
            <div class="group">
                <button onclick="exec('bold')"><i class="fa fa-bold"></i></button>
                <button onclick="addNewPage()"><i class="fa fa-plus-circle"></i></button>
            </div>
            <div class="group">
                <button onclick="generateStory()" style="color: var(--letterboxd-green);"><i class="fa-solid fa-square-poll-vertical"></i> Widget</button>
                <button onclick="exportToPDF()" style="color: #ff453a;"><i class="fa fa-file-pdf"></i></button>
                <button onclick="saveDoc()" style="color: var(--accent);"><i class="fa fa-save"></i></button>
            </div>
        </div>
    </header>

    <main id="document-container">
        <div class="page" contenteditable="true" id="p1">
            <h1>Sua Crítica</h1>
            <p>Clique em Widget para exportar este texto no formato Letterboxd com fundo transparente.</p>
        </div>
    </main>

    <footer>
        <div id="stats">Pgs: 1</div>
        <div>LIQUIDGLASS | NOIR EDITION</div>
        <div id="status">Pronto</div>
    </footer>

    <script>
        const container = document.getElementById('document-container');
        let authorName = localStorage.getItem('liquid_author') || "seu_perfil";

        function exec(cmd) { document.execCommand(cmd, false, null); }

        function applyFont(fontClass) {
            document.body.className = fontClass;
            localStorage.setItem('liquid_pref_font', fontClass);
        }

        function addNewPage() {
            const newPage = document.createElement('div');
            newPage.className = 'page';
            newPage.contentEditable = true;
            container.appendChild(newPage);
            newPage.focus();
            updateStats();
        }

        async function generateStory() {
            const status = document.getElementById('status');
            if (!localStorage.getItem('liquid_author')) {
                const name = prompt("Seu nome de usuário:", authorName);
                if (name) { authorName = name; localStorage.setItem('liquid_author', name); }
            }

            status.innerText = "Gerando PNG...";
            const widgetText = document.getElementById('widget-text');
            const widgetUser = document.getElementById('widget-user');
            const activePage = container.querySelector('.page:focus-within') || container.firstElementChild;

            widgetText.innerHTML = activePage.innerHTML;
            widgetUser.innerText = authorName.startsWith('@') ? authorName : '@' + authorName;
            
            try {
                const canvas = await html2canvas(document.getElementById('story-render-box'), {
                    backgroundColor: null, 
                    scale: 3,
                    logging: false
                });

                canvas.toBlob(async (blob) => {
                    const file = new File([blob], 'letterboxd-widget.png', { type: 'image/png' });
                    if (navigator.share) {
                        await navigator.share({ files: [file] });
                    } else {
                        const link = document.createElement('a');
                        link.download = 'widget-transparente.png';
                        link.href = canvas.toDataURL();
                        link.click();
                    }
                    status.innerText = "Exportado!";
                });
            } catch (err) { status.innerText = "Erro"; }
            setTimeout(() => status.innerText = "Pronto", 2000);
        }

        container.addEventListener('input', updateStats);
        function updateStats() {
            document.getElementById('stats').innerText = `Pgs: ${container.querySelectorAll('.page').length}`;
        }

        function exportToPDF() {
            const opt = { margin: 0, filename: 'doc.pdf', html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: 'a4' } };
            html2pdf().set(opt).from(container).save();
        }

        function saveDoc() {
            localStorage.setItem('liquid_glass_v10', container.innerHTML);
            document.getElementById('status').innerText = "Salvo!";
            setTimeout(() => document.getElementById('status').innerText = "Pronto", 2000);
        }

        window.onload = () => {
            const saved = localStorage.getItem('liquid_glass_v10');
            if (saved) container.innerHTML = saved;
        };
    </script>
</body>
</html>
