<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LiquidGlass Pro | Mobile Studio</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@300;400&family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root {
            --page-width: 210mm;
            --page-height: 297mm;
            --glass-sheet: rgba(255, 255, 255, 0.85);
            --glass-stroke: rgba(255, 255, 255, 0.4);
            --accent: #0071e3;
            --border-radius: 25px;
        }

        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }

        body {
            margin: 0; font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at center, #2c2c2e 0%, #1c1c1e 100%);
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
            color: #333;
        }

        /* Cortina de Cetim Preta Reta */
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(90deg, #000 0%, #0a0a0a 10%, #000 20%, #0a0a0a 30%, #000 40%, #0a0a0a 50%, #000 60%, #0a0a0a 70%, #000 80%, #0a0a0a 90%, #000 100%);
            opacity: 0.4; pointer-events: none; z-index: -1;
        }

        header {
            padding: 10px; display: flex; justify-content: center;
            position: fixed; width: 100%; top: 0; z-index: 1000;
        }

        .toolbar {
            background: rgba(25, 25, 25, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 8px 15px; border-radius: 50px;
            display: flex; align-items: center; gap: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 95%; overflow-x: auto; /* Scroll horizontal se os itens não couberem no mobile */
        }

        .group { display: flex; align-items: center; gap: 5px; border-right: 1px solid rgba(255,255,255,0.1); padding-right: 8px; }
        .group:last-child { border-right: none; }

        button, select {
            background: transparent; border: none; padding: 10px; cursor: pointer;
            border-radius: 12px; color: #eee; transition: 0.2s; font-size: 14px;
            white-space: nowrap;
        }

        button:active { background: rgba(255,255,255,0.2); }
        select { background: rgba(255,255,255,0.05); color: #fff; max-width: 100px; }

        main {
            flex: 1; overflow-y: auto; padding: 80px 15px 100px;
            display: flex; flex-direction: column; align-items: center; gap: 25px;
            -webkit-overflow-scrolling: touch;
        }

        /* Página Responsiva */
        .page {
            background: var(--glass-sheet);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            width: var(--page-width);
            height: var(--page-height);
            min-height: var(--page-height);
            padding: 20mm;
            border: 1px solid var(--glass-stroke);
            border-radius: var(--border-radius);
            box-shadow: 0 15px 50px rgba(0,0,0,0.3);
            outline: none; line-height: 1.6; font-size: 12pt;
            color: #1d1d1f;
            position: relative;
            overflow: hidden;
            word-wrap: break-word;
            transform-origin: top center;
        }

        /* Media Query para Mobile */
        @media screen and (max-width: 215mm) {
            .page {
                width: 95vw; /* Ocupa quase toda a largura da tela */
                height: auto; /* No mobile, a página cresce com o conteúdo para melhor leitura */
                min-height: 80vh;
                padding: 15mm 10mm;
                font-size: 11pt;
            }
            main { padding-top: 70px; }
            .toolbar { gap: 5px; padding: 5px 10px; }
            button { padding: 8px; }
        }

        .f-space { font-family: 'Space Mono', monospace; }
        .f-inter { font-family: 'Inter', sans-serif; }
        .f-code { font-family: 'JetBrains Mono', monospace; }
        .f-serif { font-family: 'Lora', serif; }

        footer {
            padding: 10px 20px; font-size: 10px; color: #aaa;
            background: rgba(10, 10, 10, 0.98); border-top: 1px solid rgba(255,255,255,0.1);
            display: flex; justify-content: space-between; align-items: center;
            z-index: 1001;
        }
    </style>
</head>
<body class="f-inter">

    <header>
        <div class="toolbar">
            <div class="group">
                <select id="fontFamily" onchange="applyFont(this.value)">
                    <option value="f-inter">Inter</option>
                    <option value="f-space">Space</option>
                    <option value="f-code">Code</option>
                    <option value="f-serif">Serif</option>
                </select>
            </div>

            <div class="group">
                <button onclick="exec('bold')"><i class="fa fa-bold"></i></button>
                <button onclick="exec('italic')"><i class="fa fa-italic"></i></button>
                <button onclick="addNewPage()"><i class="fa fa-plus-circle"></i></button>
            </div>

            <div class="group">
                <button onclick="exportToPDF()" style="color: #ff453a;"><i class="fa fa-file-pdf"></i></button>
                <button onclick="saveDoc()" style="color: var(--accent); font-weight: 600;"><i class="fa fa-save"></i></button>
            </div>
        </div>
    </header>

    <main id="document-container">
        <div class="page" contenteditable="true" id="p1">
            <h1>Studio Mobile</h1>
            <p>Toque para começar a escrever seu projeto em LiquidGlass.</p>
        </div>
    </main>

    <footer>
        <div id="stats">Pgs: 1</div>
        <div>LIQUIDGLASS MOBILE</div>
        <div id="status">Ok</div>
    </footer>

    <script>
        const container = document.getElementById('document-container');

        function exec(cmd) { document.execCommand(cmd, false, null); }

        function applyFont(fontClass) {
            document.body.className = fontClass;
            localStorage.setItem('pref_font_mobile', fontClass);
        }

        function addNewPage() {
            const newPage = document.createElement('div');
            newPage.className = 'page';
            newPage.contentEditable = true;
            container.appendChild(newPage);
            newPage.focus();
            updateStats();
        }

        // Navegação Backspace e Transbordamento (Desktop & Mobile)
        container.addEventListener('keydown', (e) => {
            const activePage = e.target;
            if (e.key === 'Backspace' && activePage.innerText.trim().length === 0) {
                const prevPage = activePage.previousElementSibling;
                if (prevPage && prevPage.classList.contains('page')) {
                    e.preventDefault();
                    activePage.remove();
                    prevPage.focus();
                    
                    const range = document.createRange();
                    const sel = window.getSelection();
                    range.selectNodeContents(prevPage);
                    range.collapse(false);
                    sel.removeAllRanges();
                    sel.addRange(range);
                    updateStats();
                }
            }
        });

        container.addEventListener('input', (e) => {
            const activePage = e.target;
            // Apenas cria nova página automaticamente se NÃO for mobile (em telas grandes)
            if (window.innerWidth > 800 && activePage.scrollHeight > activePage.offsetHeight) {
                if (activePage === container.lastElementChild) {
                    addNewPage();
                }
            }
            updateStats();
        });

        function updateStats() {
            const pages = container.querySelectorAll('.page').length;
            document.getElementById('stats').innerText = `Pgs: ${pages}`;
        }

        function exportToPDF() {
            const pages = document.querySelectorAll('.page');
            pages.forEach(p => { 
                p.style.background = "white"; 
                p.style.backdropFilter = "none";
                p.style.width = "210mm"; // Força tamanho A4 no PDF
            });

            const opt = {
                margin: 0,
                filename: 'studio-mobile.pdf',
                html2canvas: { scale: 2, useCORS: true },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(container).save().then(() => {
                pages.forEach(p => { 
                    p.style.background = ""; 
                    p.style.backdropFilter = "";
                    p.style.width = ""; 
                });
            });
        }

        function saveDoc() {
            localStorage.setItem('liquid_glass_mobile', container.innerHTML);
            document.getElementById('status').innerText = "Salvo!";
            setTimeout(() => document.getElementById('status').innerText = "Ok", 2000);
        }

        window.onload = () => {
            const saved = localStorage.getItem('liquid_glass_mobile');
            const savedFont = localStorage.getItem('pref_font_mobile');
            if (saved) container.innerHTML = saved;
            if (savedFont) {
                applyFont(savedFont);
                document.getElementById('fontFamily').value = savedFont;
            }
        };
    </script>
</body>
</html>
