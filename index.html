<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiquidGlass Pro | Studio Edition</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@300;400&family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root {
            --page-width: 210mm;
            --page-height: 297mm;
            --glass-sheet: rgba(255, 255, 255, 0.82); /* Folha branca LiquidGlass */
            --glass-stroke: rgba(255, 255, 255, 0.4);
            --accent: #0071e3;
            --border-radius: 25px; /* Pontas arredondadas solicitadas */
        }

        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }

        body {
            margin: 0; font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at center, #2c2c2e 0%, #1c1c1e 100%);
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
            color: #333;
        }

        /* Cortina de Cetim Preta Reta ao Fundo */
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(90deg, 
                #000 0%, #0a0a0a 10%, #000 20%, #0a0a0a 30%, #000 40%, 
                #0a0a0a 50%, #000 60%, #0a0a0a 70%, #000 80%, #0a0a0a 90%, #000 100%);
            opacity: 0.4; pointer-events: none; z-index: -1;
        }

        header {
            padding: 20px; display: flex; justify-content: center;
            position: fixed; width: 100%; top: 0; z-index: 1000;
        }

        .toolbar {
            background: rgba(25, 25, 25, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 10px 25px; border-radius: 50px;
            display: flex; align-items: center; gap: 15px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
        }

        .group { display: flex; align-items: center; gap: 8px; border-right: 1px solid rgba(255,255,255,0.1); padding-right: 12px; }
        .group:last-child { border-right: none; }

        button, select {
            background: transparent; border: none; padding: 8px; cursor: pointer;
            border-radius: 8px; color: #eee; transition: 0.3s; font-size: 14px;
        }

        button:hover { background: rgba(255,255,255,0.15); color: #fff; }
        select { background: rgba(255,255,255,0.1); color: #fff; outline: none; }

        main {
            flex: 1; overflow-y: overlay; padding: 120px 0 100px;
            display: flex; flex-direction: column; align-items: center; gap: 40px;
        }

        /* Página com pontas arredondadas e LiquidGlass */
        .page {
            background: var(--glass-sheet);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            width: var(--page-width);
            height: var(--page-height);
            min-height: var(--page-height);
            padding: 25mm;
            border: 1px solid var(--glass-stroke);
            border-radius: var(--border-radius); /* Aplicação das pontas arredondadas */
            box-shadow: 0 25px 80px rgba(0,0,0,0.35);
            outline: none; line-height: 1.6; font-size: 12pt;
            color: #1d1d1f;
            position: relative;
            overflow: hidden;
            word-wrap: break-word;
        }

        /* Fontes Dinâmicas */
        .f-space { font-family: 'Space Mono', monospace; }
        .f-inter { font-family: 'Inter', sans-serif; }
        .f-code { font-family: 'JetBrains Mono', monospace; }
        .f-serif { font-family: 'Lora', serif; }

        footer {
            padding: 10px 40px; font-size: 11px; color: #888;
            background: rgba(10, 10, 10, 0.98); border-top: 1px solid rgba(255,255,255,0.1);
            display: flex; justify-content: space-between; align-items: center;
        }
    </style>
</head>
<body class="f-inter">

    <header>
        <div class="toolbar">
            <div class="group">
                <select id="fontFamily" onchange="applyFont(this.value)">
                    <option value="f-inter">Inter UI</option>
                    <option value="f-space">Space Mono</option>
                    <option value="f-code">JetBrains Mono</option>
                    <option value="f-serif">Lora Serif</option>
                </select>
            </div>

            <div class="group">
                <button onclick="exec('bold')" title="Negrito"><i class="fa fa-bold"></i></button>
                <button onclick="exec('italic')" title="Itálico"><i class="fa fa-italic"></i></button>
                <button onclick="exec('underline')" title="Sublinhado"><i class="fa fa-underline"></i></button>
                <button onclick="addNewPage()" title="Nova Página"><i class="fa fa-plus-circle"></i></button>
            </div>

            <div class="group">
                <button onclick="exportToPDF()" style="color: #ff453a;"><i class="fa fa-file-pdf"></i> Exportar</button>
                <button onclick="saveDoc()" style="color: var(--accent); font-weight: 600;">Salvar</button>
            </div>
        </div>
    </header>

    <main id="document-container">
        <div class="page" contenteditable="true" id="p1">
            <h1>LiquidGlass Pro</h1>
            <p>Editor Studio com páginas arredondadas e fundo cinza sóbrio.</p>
        </div>
    </main>

    <footer>
        <div id="stats">Páginas: 1 | Palavras: 0</div>
        <div>LIQUIDGLASS PRO | CINZA STUDIO EDITION</div>
        <div id="status">Sincronizado</div>
    </footer>

    <script>
        const container = document.getElementById('document-container');

        function exec(cmd) {
            document.execCommand(cmd, false, null);
        }

        function applyFont(fontClass) {
            document.body.className = fontClass;
            localStorage.setItem('pref_font_v5', fontClass);
        }

        function addNewPage() {
            const newPage = document.createElement('div');
            newPage.className = 'page';
            newPage.contentEditable = true;
            container.appendChild(newPage);
            newPage.focus();
            updateStats();
        }

        // Sistema de navegação Backspace e Transbordamento
        container.addEventListener('keydown', (e) => {
            const activePage = e.target;

            // Deletar página ao usar Backspace no início
            if (e.key === 'Backspace' && activePage.innerText.trim().length === 0) {
                const prevPage = activePage.previousElementSibling;
                if (prevPage && prevPage.classList.contains('page')) {
                    e.preventDefault();
                    activePage.remove();
                    prevPage.focus();
                    
                    const range = document.createRange();
                    const sel = window.getSelection();
                    range.selectNodeContents(prevPage);
                    range.collapse(false);
                    sel.removeAllRanges();
                    sel.addRange(range);
                    updateStats();
                }
            }
        });

        container.addEventListener('input', (e) => {
            const activePage = e.target;
            
            // Criar nova página automaticamente se o conteúdo transbordar
            if (activePage.scrollHeight > activePage.offsetHeight) {
                if (activePage === container.lastElementChild) {
                    addNewPage();
                } else {
                    activePage.nextElementSibling.focus();
                }
            }
            updateStats();
        });

        function updateStats() {
            const pages = container.querySelectorAll('.page').length;
            const text = container.innerText.trim();
            const words = text ? text.split(/\s+/).length : 0;
            document.getElementById('stats').innerText = `Páginas: ${pages} | Palavras: ${words}`;
        }

        function exportToPDF() {
            const pages = document.querySelectorAll('.page');
            
            // Ajuste temporário para PDF profissional (sem transparência)
            pages.forEach(p => { 
                p.style.background = "white"; 
                p.style.backdropFilter = "none";
                p.style.borderRadius = "0"; // PDF padrão não costuma ter bordas arredondadas, mas pode manter se preferir
            });

            const opt = {
                margin: 0,
                filename: 'documento-liquidglass.pdf',
                html2canvas: { scale: 2 },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(container).save().then(() => {
                // Restaurar estética LiquidGlass Studio
                pages.forEach(p => { 
                    p.style.background = ""; 
                    p.style.backdropFilter = "";
                    p.style.borderRadius = "";
                });
            });
        }

        function saveDoc() {
            localStorage.setItem('liquid_glass_v5', container.innerHTML);
            const status = document.getElementById('status');
            status.innerText = "Salvo!";
            setTimeout(() => status.innerText = "Sincronizado", 2000);
        }

        window.onload = () => {
            const saved = localStorage.getItem('liquid_glass_v5');
            const savedFont = localStorage.getItem('pref_font_v5');
            if (saved) {
                container.innerHTML = saved;
                updateStats();
            }
            if (savedFont) {
                applyFont(savedFont);
                document.getElementById('fontFamily').value = savedFont;
            }
        };
    </script>
</body>
</html>
